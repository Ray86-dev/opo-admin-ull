<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#f7f4ee" />
    <meta name="description" content="Web de estudio para la oposición a la Escala Administrativa (C1) de la Universidad de La Laguna" />
    <link rel="icon" type="image/svg+xml" href="/opo-admin-ull/favicon.svg" />
    <link rel="apple-touch-icon" href="/opo-admin-ull/icon-192.png" />
    <title>Opo ULL · Escala Administrativa</title>
    <script>
      try {
        var s = JSON.parse(localStorage.getItem('opo-ull-progress') || '{}').state || {};
        var t = (s.settings || {}).tema || 'sistema';
        if (t === 'oscuro' || (t === 'sistema' && matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.classList.add('dark');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
